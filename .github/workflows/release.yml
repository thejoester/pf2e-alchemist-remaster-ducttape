name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    uses: thejoester/foundry-release-action/.github/workflows/release.yml@v1
    with:
      module-id: pf2e-alchemist-remaster-ducttape
      build-packs: true
      publish-foundry: true
      pack-verify-cmd: node _build/verify-extracted-packs.mjs
    secrets:
      FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
